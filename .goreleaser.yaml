version: 2

builds:
  - main: .
    binary: godocs-watcher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

gitea_urls:
  api: https://git.bytestone.uk/api/v1
  download: https://git.bytestone.uk

release:
  gitea:
    owner: hum3
    name: godocs-watcher
  # tp release writes the release notes; keep them.
  mode: keep-existing

changelog:
  disable: true
